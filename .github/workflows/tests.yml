# Runs JVM unit tests for all modules (e.g. :core:test, :app:test).

name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Check public API (ABI dump)
        run: ./gradlew :core:apiCheck --stacktrace --no-daemon

  release-r8:
    name: Release build (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release with R8
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Check manifest-declared initializers survive R8
        run: .github/scripts/check-r8-initializers.sh

      - name: Analyze R8 configuration
        run: ./gradlew :app:analyzeReleaseR8Config --stacktrace --no-daemon

      - name: Upload R8 analyzer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-config-analyzer
          path: app/build/reports/r8
          if-no-files-found: warn
